<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Driving Simulator</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* FIX ANDROID WEBVIEW */
        * { touch-action: manipulation !important; -webkit-tap-highlight-color: transparent; }
        #ui-overlay { pointer-events: auto !important; z-index: 10000 !important; position: absolute; top:0; left:0; width:100%; height:100%; }
        .menu-screen { pointer-events: auto !important; }
        .menu-btn { pointer-events: auto !important; cursor: pointer; position: relative; z-index: 10001; }
        #gameCanvas { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; pointer-events: none; }
        .active #gameCanvas { pointer-events: none; }
        #game-hud.active #gameCanvas { pointer-events: auto; }
    </style>
    <!-- LOCAL LIBS - ضروري للأندرويد -->
    <script src="libs/babylon.js"></script>
    <script src="libs/babylonjs.loaders.min.js"></script>
    <script src="libs/babylon.gui.min.js"></script>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-overlay">
        <div id="main-menu" class="menu-screen active">
            <h1 class="game-title">DRIVING SIMULATOR</h1>
            <div class="menu-buttons">
                <button class="menu-btn" id="btn-free-drive">FREE DRIVE</button>
                <button class="menu-btn" id="btn-multiplayer">MULTIPLAYER</button>
                <button class="menu-btn" id="btn-mod-manager">MOD MANAGER</button>
                <button class="menu-btn" id="btn-settings">SETTINGS</button>
            </div>
        </div>
        <div id="multiplayer-menu" class="menu-screen">
            <h2>MULTIPLAYER</h2>
            <div class="menu-buttons">
                <button class="menu-btn" id="btn-create-host">CREATE HOST</button>
                <button class="menu-btn" id="btn-join-room">JOIN ROOM</button>
                <button class="menu-btn btn-back" id="btn-back-main">BACK</button>
            </div>
        </div>
        <div id="host-screen" class="menu-screen"><h2>CREATE ROOM</h2><div class="menu-buttons"><button class="menu-btn" id="btn-start-game">START GAME</button><button class="menu-btn btn-back" id="btn-back-multi">BACK</button></div></div>
        <div id="join-screen" class="menu-screen"><h2>JOIN ROOM</h2><div class="menu-buttons"><button class="menu-btn btn-back" id="btn-back-join">BACK</button></div></div>
        <div id="mod-manager-screen" class="menu-screen"><h2>MOD MANAGER</h2><div class="menu-buttons"><button class="menu-btn btn-back" id="btn-back-mods">BACK</button></div></div>
        <div id="game-hud" class="hidden"><div id="top-hud"><span id="speed-display">0 km/h</span></div></div>
        <div id="loading-screen" class="menu-screen"><p id="loading-text">Loading...</p></div>
    </div>

    <input type="file" id="file-input" accept=".glb,.gltf" style="display:none" multiple>
    
    <!-- FIX CLICK FOR ANDROID -->
    <script>
    (function(){
        function enableButtons(){
            document.querySelectorAll('.menu-btn').forEach(function(btn){
                btn.addEventListener('touchend', function(e){
                    e.preventDefault();
                    console.log('TOUCH: ' + this.id);
                    this.click();
                }, {passive:false});
                btn.addEventListener('click', function(){
                    console.log('CLICK: ' + this.id);
                });
            });
            // Force menu visible
            var main = document.getElementById('main-menu');
            if(main) main.classList.add('active');
        }
        if(document.readyState === 'loading'){
            document.addEventListener('DOMContentLoaded', enableButtons);
        } else {
            enableButtons();
        }
        setTimeout(enableButtons, 1000);
        window.onerror = function(m,u,l){ console.log('JS ERROR: '+m+' @'+l); };
    })();
    </script>

    <!-- GAME SCRIPTS - مرة واحدة فقط -->
    <script src="js/utils/ErrorHandler.js"></script>
    <script src="js/engine/InputManager.js"></script>
    <script src="js/engine/SceneManager.js"></script>
    <script src="js/engine/GameEngine.js"></script>
    <script src="js/ui/UIManager.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
