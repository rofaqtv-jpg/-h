name: Driving Simulator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  BUILD_DIR: 'dist'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm init -y && npm install --save-dev eslint @babel/eslint-parser || true
      - run: npx eslint . --ext .js --ignore-pattern "node_modules/" --ignore-pattern "native/" || true
        continue-on-error: true

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build ALL files
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          echo "=== ROOT FILES ==="
          ls -la
          
          # انسخ كل شيء مهم للعبة
          cp index.html ${{ env.BUILD_DIR }}/ 2>/dev/null || echo "no index.html in root"
          
          for dir in css js scripts src assets images img models textures sounds audio libs vendor; do
            if [ -d "$dir" ]; then
              echo "Copying $dir"
              cp -r "$dir" ${{ env.BUILD_DIR }}/
            fi
          done
          
          # انسخ كل ملفات html, js, css, json, wasm, glb, gltf, png, jpg, mp3, ogg
          find . -maxdepth 2 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.json" \) ! -path "./node_modules/*" ! -path "./native/*" ! -path "./dist/*" ! -path "./.git/*" -exec cp {} ${{ env.BUILD_DIR }}/ \; 2>/dev/null || true
          
          echo "=== BUILD DIR ==="
          ls -la ${{ env.BUILD_DIR }}/
          find ${{ env.BUILD_DIR }} -type f | head -50

      - name: Create ZIP
        run: |
          cd ${{ env.BUILD_DIR }}
          zip -r ../driving-simulator-web.zip . || true
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            ${{ env.BUILD_DIR }}
            driving-simulator-web.zip

  build-wasm:
    name: Build WASM Physics Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v12
      - name: Compile C++ to WebAssembly
        run: |
          mkdir -p wasm-build
          if [ -f "native/wasm/physics_bridge.cpp" ]; then
            emcc native/wasm/physics_bridge.cpp -O3 -s WASM=1 -o wasm-build/physics_bridge.js
          else
            echo "// placeholder" > wasm-build/physics_bridge.js
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-physics
          path: wasm-build/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Fix Android project - READ ALL FILES
        run: |
          mkdir -p native/android/app/src/main/java/com/turrini/drivingsim
          mkdir -p native/android/app/src/main/assets
          mkdir -p native/android/app/src/main/res/values
          
          cat > native/android/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          EOF

          cat > native/android/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DrivingSimulator"
          include ':app'
          EOF

          cat > native/android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.turrini.drivingsim'
              compileSdk 34
              defaultConfig { applicationId "com.turrini.drivingsim"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0.0" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF

          cat > native/android/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.DrivingSimulator" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowNoTitle">true</item>
              </style>
          </resources>
          EOF

          cat > native/android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Driving Simulator" android:theme="@style/Theme.DrivingSimulator" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > native/android/app/src/main/java/com/turrini/drivingsim/MainActivity.java <<'EOF'
          package com.turrini.drivingsim;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
              @Override public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          
      - name: Copy ALL web assets to APK
        run: |
          rm -rf native/android/app/src/main/assets/*
          mkdir -p native/android/app/src/main/assets
          
          echo "=== web-build structure ==="
          ls -R web-build | head -100
          
          # الحالة 1: web-build/dist موجود
          if [ -d "web-build/dist" ] && [ "$(ls -A web-build/dist)" ]; then
            echo "Copying from web-build/dist"
            cp -r web-build/dist/* native/android/app/src/main/assets/
          # الحالة 2: web-build مباشرة فيها الملفات
          else
            echo "Copying from web-build"
            cp -r web-build/* native/android/app/src/main/assets/ 2>/dev/null || true
          fi
          
          # نسخ إضافي من الجذر باش نتأكد
          for f in index.html; do [ -f "$f" ] && cp "$f" native/android/app/src/main/assets/ || true; done
          for d in css js src assets images img models textures libs; do [ -d "$d" ] && cp -r "$d" native/android/app/src/main/assets/ || true; done
          
          rm -f native/android/app/src/main/assets/*.zip || true
          
          echo "=== FINAL ASSETS ==="
          ls -la native/android/app/src/main/assets/
          find native/android/app/src/main/assets -type f | head -50
          
          if [ ! -f "native/android/app/src/main/assets/index.html" ]; then
            echo "FATAL: index.html missing!"
            exit 1
          fi

      - name: Build APK
        run: |
          cd native/android
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: driving-simulator-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: deploy
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/dist
      - id: deployment
        uses: actions/deploy-pages@v4
