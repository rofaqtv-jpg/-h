name: Driving Simulator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  BUILD_DIR: 'dist'
  ANDROID_DIR: 'native/android'

jobs:
  # ===== CODE QUALITY =====
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev eslint @babel/eslint-parser

      - name: Run ESLint
        run: |
          npx eslint js/**/*.js --ext .js || true
        continue-on-error: true

      - name: Check file sizes
        run: |
          echo "Checking for large files..."
          find . -type f -size +10M | grep -v node_modules || echo "No large files found"

  # ===== BUILD WEB VERSION =====
  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Copy game files
        run: |
          cp -r index.html css js ${{ env.BUILD_DIR }}/
          
      - name: Download Babylon.js dependencies
        run: |
          cd ${{ env.BUILD_DIR }}
          mkdir -p libs
          
          # Download Babylon.js core
          curl -L "https://cdn.babylonjs.com/babylon.js" -o libs/babylon.js
          curl -L "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" -o libs/babylonjs.loaders.min.js
          curl -L "https://cdn.babylonjs.com/gui/babylon.gui.min.js" -o libs/babylon.gui.min.js
          
          # Download Havok Physics
          curl -L "https://cdn.babylonjs.com/havok/HavokPhysics.bundled.js" -o libs/HavokPhysics.bundled.js || true

      - name: Update index.html for local libs
        run: |
          cd ${{ env.BUILD_DIR }}
          sed -i 's|https://cdn.babylonjs.com/babylon.js|libs/babylon.js|g' index.html
          sed -i 's|https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js|libs/babylonjs.loaders.min.js|g' index.html
          sed -i 's|https://cdn.babylonjs.com/gui/babylon.gui.min.js|libs/babylon.gui.min.js|g' index.html

      - name: Minify JavaScript (optional)
        run: |
          npm install --save-dev terser
          cd ${{ env.BUILD_DIR }}/js
          find . -name "*.js" -exec npx terser {} --compress --mangle -o {}.min.js \; || true

      - name: Create ZIP archive
        run: |
          cd ${{ env.BUILD_DIR }}
          zip -r ../driving-simulator-web.zip .

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            ${{ env.BUILD_DIR }}
            driving-simulator-web.zip
          retention-days: 30

  # ===== BUILD WASM PHYSICS =====
  build-wasm:
    name: Build WASM Physics Bridge
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v12

      - name: Compile C++ to WebAssembly
        run: |
          mkdir -p wasm-build
          emcc native/wasm/physics_bridge.cpp \
            -O3 \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_vec3_add","_vec3_sub","_vec3_scale","_vec3_length","_vec3_normalize","_quat_multiply","_quat_from_axis_angle","_quat_rotate","_calculate_suspension","_calculate_tire_force"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o wasm-build/physics_bridge.js

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-physics
          path: wasm-build/
          retention-days: 30

        
          # ===== BUILD ANDROID APK =====
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Check Android project structure
        id: check-android
        run: |
          echo "🔍 Checking Android project structure..."
          
          MISSING_FILES=""
          
          if [ ! -f "native/android/build.gradle" ]; then
            MISSING_FILES="$MISSING_FILES build.gradle"
          fi
          
          if [ ! -f "native/android/settings.gradle" ]; then
            MISSING_FILES="$MISSING_FILES settings.gradle"
          fi
          
          if [ ! -f "native/android/app/build.gradle" ]; then
            MISSING_FILES="$MISSING_FILES app/build.gradle"
          fi
          
          if [ ! -f "native/android/gradlew" ]; then
            MISSING_FILES="$MISSING_FILES gradlew"
          fi
          
          if [ ! -f "native/android/gradle/wrapper/gradle-wrapper.jar" ]; then
            MISSING_FILES="$MISSING_FILES gradle/wrapper/gradle-wrapper.jar"
          fi
          
          if [ -n "$MISSING_FILES" ]; then
            echo "❌ Missing files:$MISSING_FILES"
            echo "android_complete=false" >> $GITHUB_OUTPUT
            echo ""
            echo "Creating missing files..."
            
            # Create missing directories
            mkdir -p native/android/gradle/wrapper
            mkdir -p native/android/app/src/main/java/com/turrini/drivingsim
            mkdir -p native/android/app/src/main/res/layout
            mkdir -p native/android/app/src/main/res/values
            mkdir -p native/android/app/src/main/assets
            
            # Download gradle wrapper if missing
            if [ ! -f "native/android/gradle/wrapper/gradle-wrapper.jar" ]; then
              echo "📥 Downloading gradle-wrapper.jar..."
              curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" \
                -o native/android/gradle/wrapper/gradle-wrapper.jar || echo "Failed to download"
            fi
            
            # Create gradlew if missing
            if [ ! -f "native/android/gradlew" ]; then
              echo "📝 Creating gradlew..."
              cat > native/android/gradlew << 'GRADLEW_EOF'
#!/bin/sh
APP_HOME=$( cd "${0%/*}" > /dev/null && pwd -P ) || exit
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
GRADLEW_EOF
              chmod +x native/android/gradlew
            fi
            
            # Create build.gradle if missing
            if [ ! -f "native/android/build.gradle" ]; then
              echo "📝 Creating root build.gradle..."
              cat > native/android/build.gradle << 'BUILD_EOF'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
BUILD_EOF
            fi
            
            # Create settings.gradle if missing
            if [ ! -f "native/android/settings.gradle" ]; then
              echo "📝 Creating settings.gradle..."
              cat > native/android/settings.gradle << 'SETTINGS_EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "DrivingSimulator"
include ':app'
SETTINGS_EOF
            fi
            
            # Create app/build.gradle if missing
            if [ ! -f "native/android/app/build.gradle" ]; then
              echo "📝 Creating app/build.gradle..."
              cat > native/android/app/build.gradle << 'APP_BUILD_EOF'
plugins {
    id 'com.android.application'
}
android {
    namespace 'com.turrini.drivingsim'
    compileSdk 34
    defaultConfig {
        applicationId "com.turrini.drivingsim"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
APP_BUILD_EOF
            fi
            
            # Create gradle.properties if missing
            if [ ! -f "native/android/gradle.properties" ]; then
              echo "📝 Creating gradle.properties..."
              cat > native/android/gradle.properties << 'PROPS_EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
PROPS_EOF
            fi
            
            # Create gradle-wrapper.properties if missing
            if [ ! -f "native/android/gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "📝 Creating gradle-wrapper.properties..."
              cat > native/android/gradle/wrapper/gradle-wrapper.properties << 'WRAPPER_EOF'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
WRAPPER_EOF
            fi
            
            echo "✅ Created missing files"
          else
            echo "✅ All Android files present"
            echo "android_complete=true" >> $GITHUB_OUTPUT
          fi

      - name: Copy web assets to Android
        run: |
          mkdir -p native/android/app/src/main/assets
          cp -r web-build/* native/android/app/src/main/assets/
          echo "✅ Web assets copied to Android project"

      - name: Make gradlew executable
        run: |
          cd native/android
          chmod +x gradlew || echo "gradlew not found or already executable"
          chmod +x gradlew.bat 2>/dev/null || true

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd native/android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Verify APK files
        run: |
          echo "📦 Checking for APK files..."
          find native/android -name "*.apk" -type f
          
          if [ -f "native/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK found"
            ls -lh native/android/app/build/outputs/apk/debug/
          else
            echo "❌ Debug APK not found"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: driving-simulator-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
        
  # ===== DEPLOY TO GITHUB PAGES =====
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: deploy

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===== CREATE RELEASE =====
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm]
    if: github.event_name == 'release'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release package
        run: |
          mkdir -p release
          cd artifacts
          
          # Package web version
          if [ -d "web-build" ]; then
            cd web-build
            zip -r ../../release/driving-simulator-web-${{ github.ref_name }}.zip .
            cd ..
          fi
          
          # Package WASM
          if [ -d "wasm-physics" ]; then
            cd wasm-physics
            zip -r ../../release/physics-bridge-wasm-${{ github.ref_name }}.zip .
            cd ..
          fi
          
          # Package Android (if exists)
          if [ -d "android-apk" ]; then
            cd android-apk
            zip -r ../../release/driving-simulator-android-${{ github.ref_name }}.zip .
            cd ..
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== TEST REPORT =====
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate report
        run: |
          echo "# Build Report" > report.md
          echo "" >> report.md
          echo "**Branch:** ${{ github.ref_name }}" >> report.md
          echo "**Commit:** ${{ github.sha }}" >> report.md
          echo "**Date:** $(date -u)" >> report.md
          echo "" >> report.md
          echo "## Build Status" >> report.md
          echo "- Web Build: ${{ needs.build-web.result }}" >> report.md
          echo "- WASM Build: ${{ needs.build-wasm.result }}" >> report.md
          echo "" >> report.md
          echo "## Files" >> report.md
          find . -type f -name "*.js" | wc -l | xargs -I {} echo "- JavaScript files: {}" >> report.md
          find . -type f -name "*.html" | wc -l | xargs -I {} echo "- HTML files: {}" >> report.md
          find . -type f -name "*.css" | wc -l | xargs -I {} echo "- CSS files: {}" >> report.md

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.md
          retention-days: 7

  # ===== NOTIFY ON FAILURE =====
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm, build-android]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "❌ Build failed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
