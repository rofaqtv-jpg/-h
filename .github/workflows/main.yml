name: Driving Simulator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  BUILD_DIR: 'dist'
  ANDROID_DIR: 'native/android'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev eslint @babel/eslint-parser

      - name: Run ESLint
        run: npx eslint js/**/*.js --ext .js || true
        continue-on-error: true

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Copy game files
        run: cp -r index.html css js ${{ env.BUILD_DIR }}/ || echo "Some files missing, continuing..."

      - name: Download Babylon.js dependencies
        run: |
          cd ${{ env.BUILD_DIR }}
          mkdir -p libs
          curl -L "https://cdn.babylonjs.com/babylon.js" -o libs/babylon.js || true
          curl -L "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" -o libs/babylonjs.loaders.min.js || true
          curl -L "https://cdn.babylonjs.com/gui/babylon.gui.min.js" -o libs/babylon.gui.min.js || true
          curl -L "https://cdn.babylonjs.com/havok/HavokPhysics.bundled.js" -o libs/HavokPhysics.bundled.js || true

      - name: Update index.html for local libs
        run: |
          cd ${{ env.BUILD_DIR }}
          sed -i 's|https://cdn.babylonjs.com/babylon.js|libs/babylon.js|g' index.html || true
          sed -i 's|https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js|libs/babylonjs.loaders.min.js|g' index.html || true
          sed -i 's|https://cdn.babylonjs.com/gui/babylon.gui.min.js|libs/babylon.gui.min.js|g' index.html || true

      - name: Create ZIP archive
        run: |
          cd ${{ env.BUILD_DIR }}
          zip -r ../driving-simulator-web.zip . || true

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            ${{ env.BUILD_DIR }}
            driving-simulator-web.zip
          retention-days: 30

  build-wasm:
    name: Build WASM Physics Bridge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v12

      - name: Compile C++ to WebAssembly
        run: |
          mkdir -p wasm-build
          if [ -f "native/wasm/physics_bridge.cpp" ]; then
            emcc native/wasm/physics_bridge.cpp -O3 -s WASM=1 \
              -s EXPORTED_FUNCTIONS='["_vec3_add","_vec3_sub","_vec3_scale","_vec3_length","_vec3_normalize","_quat_multiply","_quat_from_axis_angle","_quat_rotate","_calculate_suspension","_calculate_tire_force"]' \
              -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
              -o wasm-build/physics_bridge.js
          else
            echo "C++ file not found, skipping WASM build."
          fi

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-physics
          path: wasm-build/
          retention-days: 30

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Check & Fix Android project structure
        id: check-android
        run: |
          echo "🔍 Checking Android project structure..."
          
          mkdir -p native/android/gradle/wrapper
          mkdir -p native/android/app/src/main/java/com/turrini/drivingsim
          mkdir -p native/android/app/src/main/res/layout
          mkdir -p native/android/app/src/main/res/values
          mkdir -p native/android/app/src/main/assets
          
          if [ ! -f "native/android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "📥 Downloading gradle-wrapper.jar..."
            curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" -o native/android/gradle/wrapper/gradle-wrapper.jar || echo "Failed"
          fi
          
          if [ ! -f "native/android/gradlew" ]; then
            echo "📝 Creating gradlew..."
            printf '#!/bin/sh\nAPP_HOME=$( cd "${0%%/*}" > /dev/null && pwd -P ) || exit\nCLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar\nexec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"\n' > native/android/gradlew
            chmod +x native/android/gradlew
          fi
          
          if [ ! -f "native/android/build.gradle" ]; then
            echo "📝 Creating root build.gradle..."
            echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.0' } }" > native/android/build.gradle
            echo "allprojects { repositories { google(); mavenCentral() } }" >> native/android/build.gradle
          fi
          
          if [ ! -f "native/android/settings.gradle" ]; then
            echo "📝 Creating settings.gradle..."
            echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > native/android/settings.gradle
            echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> native/android/settings.gradle
            echo "rootProject.name = \"DrivingSimulator\"" >> native/android/settings.gradle
            echo "include ':app'" >> native/android/settings.gradle
          fi
          
          if [ ! -f "native/android/app/build.gradle" ]; then
            echo "📝 Creating app/build.gradle..."
            echo "plugins { id 'com.android.application' }" > native/android/app/build.gradle
            echo "android { namespace 'com.turrini.drivingsim'; compileSdk 34; defaultConfig { applicationId \"com.turrini.drivingsim\"; minSdk 24; targetSdk 34; versionCode 1; versionName \"1.0.0\" }; buildTypes { release { minifyEnabled false } }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }" >> native/android/app/build.gradle
            echo "dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.9.0' }" >> native/android/app/build.gradle
          fi

          if [ ! -f "native/android/app/src/main/AndroidManifest.xml" ]; then
            echo "📝 Creating AndroidManifest.xml..."
            echo '<?xml version="1.0" encoding="utf-8"?>' > native/android/app/src/main/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.turrini.drivingsim">' >> native/android/app/src/main/AndroidManifest.xml
            echo '    <uses-permission android:name="android.permission.INTERNET" />' >> native/android/app/src/main/AndroidManifest.xml
            echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> native/android/app/src/main/AndroidManifest.xml
            echo '    <application android:allowBackup="true" android:label="Driving Simulator" android:theme="@android:style/Theme.NoTitleBar.Fullscreen" android:usesCleartextTraffic="true">' >> native/android/app/src/main/AndroidManifest.xml
            echo '        <activity android:name=".MainActivity" android:exported="true">' >> native/android/app/src/main/AndroidManifest.xml
            echo '            <intent-filter>' >> native/android/app/src/main/AndroidManifest.xml
            echo '                <action android:name="android.intent.action.MAIN" />' >> native/android/app/src/main/AndroidManifest.xml
            echo '                <category android:name="android.intent.category.LAUNCHER" />' >> native/android/app/src/main/AndroidManifest.xml
            echo '            </intent-filter>' >> native/android/app/src/main/AndroidManifest.xml
            echo '        </activity>' >> native/android/app/src/main/AndroidManifest.xml
            echo '    </application>' >> native/android/app/src/main/AndroidManifest.xml
            echo '</manifest>' >> native/android/app/src/main/AndroidManifest.xml
          fi
          
          echo "✅ Android structure verified and fixed."

      - name: Copy web assets to Android
        run: |
          mkdir -p native/android/app/src/main/assets
          cp -r web-build/* native/android/app/src/main/assets/ || true
          echo "✅ Web assets copied to Android project"

      - name: Make gradlew executable
        run: |
          cd native/android
          chmod +x gradlew || echo "gradlew not found or already executable"
          chmod +x gradlew.bat 2>/dev/null || true

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: |
          cd native/android
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Verify APK files
        run: |
          echo "📦 Checking for APK files..."
          find native/android -name "*.apk" -type f
          if [ -f "native/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Debug APK found"
            ls -lh native/android/app/build/outputs/apk/debug/
          else
            echo "❌ Debug APK not found"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: driving-simulator-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
        
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: deploy

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm, build-android]
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release package
        run: |
          mkdir -p release
          cd artifacts
          if [ -d "web-build" ]; then cd web-build && zip -r ../../release/driving-simulator-web-${{ github.ref_name }}.zip . && cd ..; fi
          if [ -d "wasm-physics" ]; then cd wasm-physics && zip -r ../../release/physics-bridge-wasm-${{ github.ref_name }}.zip . && cd ..; fi
          if [ -d "driving-simulator-debug-apk" ]; then cd driving-simulator-debug-apk && zip -r ../../release/driving-simulator-android-${{ github.ref_name }}.zip . && cd ..; fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
