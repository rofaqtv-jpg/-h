name: Driving Simulator CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  NODE_VERSION: '18'
  BUILD_DIR: 'dist'
  ANDROID_DIR: 'native/android'

jobs:
  # ===== CODE QUALITY =====
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm init -y
          npm install --save-dev eslint @babel/eslint-parser

      - name: Run ESLint
        run: |
          npx eslint js/**/*.js --ext .js || true
          npx eslint src/js/**/*.js --ext .js || true
        continue-on-error: true

      - name: Check file sizes
        run: |
          echo "Checking for large files..."
          find . -type f -size +10M | grep -v node_modules || echo "No large files found"

  # ===== BUILD WEB VERSION =====
  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create build directory and copy files
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          ls -la
          ls -la src/ || true
          
          if [ -f "src/index.html" ]; then
            echo "Copying from src/"
            cp src/index.html ${{ env.BUILD_DIR }}/
            cp -r src/css ${{ env.BUILD_DIR }}/ 2>/dev/null || true
            cp -r src/js ${{ env.BUILD_DIR }}/ 2>/dev/null || true
            # إلا عندك css و js برا src
            [ -d "css" ] && cp -r css ${{ env.BUILD_DIR }}/ || true
            [ -d "js" ] && cp -r js ${{ env.BUILD_DIR }}/ || true
          elif [ -f "index.html" ]; then
            echo "Copying from root"
            cp -r index.html css js ${{ env.BUILD_DIR }}/
          else
            echo "index.html not found!"
            find . -name "index.html"
            exit 1
          fi
          
          ls -la ${{ env.BUILD_DIR }}/
          
      - name: Download Babylon.js dependencies
        run: |
          cd ${{ env.BUILD_DIR }}
          mkdir -p libs
          
          curl -L "https://cdn.babylonjs.com/babylon.js" -o libs/babylon.js
          curl -L "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" -o libs/babylonjs.loaders.min.js
          curl -L "https://cdn.babylonjs.com/gui/babylon.gui.min.js" -o libs/babylon.gui.min.js
          curl -L "https://cdn.babylonjs.com/havok/HavokPhysics.bundled.js" -o libs/HavokPhysics.bundled.js || true

      - name: Update index.html for local libs
        run: |
          cd ${{ env.BUILD_DIR }}
          sed -i 's|https://cdn.babylonjs.com/babylon.js|libs/babylon.js|g' index.html
          sed -i 's|https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js|libs/babylonjs.loaders.min.js|g' index.html
          sed -i 's|https://cdn.babylonjs.com/gui/babylon.gui.min.js|libs/babylon.gui.min.js|g' index.html

      - name: Minify JavaScript (optional)
        run: |
          npm install --save-dev terser
          cd ${{ env.BUILD_DIR }}/js
          find . -name "*.js" -exec npx terser {} --compress --mangle -o {}.min.js \; || true

      - name: Create ZIP archive
        run: |
          cd ${{ env.BUILD_DIR }}
          zip -r ../driving-simulator-web.zip .

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            ${{ env.BUILD_DIR }}
            driving-simulator-web.zip
          retention-days: 30

  # ===== BUILD WASM PHYSICS =====
  build-wasm:
    name: Build WASM Physics Bridge
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v12

      - name: Compile C++ to WebAssembly
        run: |
          mkdir -p wasm-build
          emcc native/wasm/physics_bridge.cpp \
            -O3 \
            -s WASM=1 \
            -s EXPORTED_FUNCTIONS='["_vec3_add","_vec3_sub","_vec3_scale","_vec3_length","_vec3_normalize","_quat_multiply","_quat_from_axis_angle","_quat_rotate","_calculate_suspension","_calculate_tire_force"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]' \
            -o wasm-build/physics_bridge.js

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-physics
          path: wasm-build/
          retention-days: 30

  # ===== BUILD ANDROID APK =====
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Copy web assets to Android
        run: |
          mkdir -p ${{ env.ANDROID_DIR }}/app/src/main/assets
          cp -r web-build/* ${{ env.ANDROID_DIR }}/app/src/main/assets/

      - name: Build Android project
        run: |
          cd ${{ env.ANDROID_DIR }}
          chmod +x gradlew
          ./gradlew assembleRelease || echo "Android build requires full project setup"
        continue-on-error: true

      - name: Upload Android artifact (if built)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/
          retention-days: 30

  # ===== DEPLOY TO GITHUB PAGES =====
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: deploy

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ===== CREATE RELEASE =====
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm]
    if: github.event_name == 'release'
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release package
        run: |
          mkdir -p release
          cd artifacts
          
          if [ -d "web-build" ]; then
            cd web-build
            zip -r ../../release/driving-simulator-web-${{ github.ref_name }}.zip .
            cd ..
          fi
          
          if [ -d "wasm-physics" ]; then
            cd wasm-physics
            zip -r ../../release/physics-bridge-wasm-${{ github.ref_name }}.zip .
            cd ..
          fi
          
          if [ -d "android-apk" ]; then
            cd android-apk
            zip -r ../../release/driving-simulator-android-${{ github.ref_name }}.zip .
            cd ..
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===== TEST REPORT =====
  test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate report
        run: |
          echo "# Build Report" > report.md
          echo "" >> report.md
          echo "**Branch:** ${{ github.ref_name }}" >> report.md
          echo "**Commit:** ${{ github.sha }}" >> report.md
          echo "**Date:** $(date -u)" >> report.md
          echo "" >> report.md
          echo "## Build Status" >> report.md
          echo "- Web Build: ${{ needs.build-web.result }}" >> report.md
          echo "- WASM Build: ${{ needs.build-wasm.result }}" >> report.md
          echo "" >> report.md
          echo "## Files" >> report.md
          find . -type f -name "*.js" | wc -l | xargs -I {} echo "- JavaScript files: {}" >> report.md
          find . -type f -name "*.html" | wc -l | xargs -I {} echo "- HTML files: {}" >> report.md
          find . -type f -name "*.css" | wc -l | xargs -I {} echo "- CSS files: {}" >> report.md

      - name: Upload report
        uses: actions/upload-artifact@v3
        with:
          name: build-report
          path: report.md
          retention-days: 7

  # ===== NOTIFY ON FAILURE =====
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-web, build-wasm, build-android]
    if: failure()
    
    steps:
      - name: Send notification
        run: |
          echo "❌ Build failed!"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
