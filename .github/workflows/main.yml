name: Driving Simulator CI/CD
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
env:
  NODE_VERSION: '18'
  BUILD_DIR: 'dist'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - run: npm init -y && npm install --save-dev eslint @babel/eslint-parser || true
      - run: npx eslint . --ext .js --ignore-pattern "node_modules/" --ignore-pattern "native/" || true
        continue-on-error: true
  build-web:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - name: Build ALL files
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          cp index.html ${{ env.BUILD_DIR }}/ 2>/dev/null || true
          for dir in css js scripts src assets images img models textures sounds audio libs vendor; do [ -d "$dir" ] && cp -r "$dir" ${{ env.BUILD_DIR }}/; done
          if [ ! -f "${{ env.BUILD_DIR }}/libs/babylon.js" ]; then
            mkdir -p ${{ env.BUILD_DIR }}/libs
            curl -sL "https://cdn.babylonjs.com/babylon.js" -o ${{ env.BUILD_DIR }}/libs/babylon.js
            curl -sL "https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" -o ${{ env.BUILD_DIR }}/libs/babylonjs.loaders.min.js
            curl -sL "https://cdn.babylonjs.com/gui/babylon.gui.min.js" -o ${{ env.BUILD_DIR }}/libs/babylon.gui.min.js
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: ${{ env.BUILD_DIR }}
  build-android:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with: { name: web-build, path: web-build }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Create Android files
        run: |
          python3 -c "
          import pathlib
          def w(p,c):
              pathlib.Path(p).parent.mkdir(parents=True, exist_ok=True)
              open(p,'w',encoding='utf-8').write(c)
          w('native/android/build.gradle','buildscript{repositories{google();mavenCentral()} dependencies{classpath \"com.android.tools.build:gradle:8.2.0\"}} allprojects{repositories{google();mavenCentral()}}')
          w('native/android/settings.gradle','pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}} dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS) repositories{google();mavenCentral()}} rootProject.name=\"DrivingSimulator\" include \":app\"')
          w('native/android/gradle/wrapper/gradle-wrapper.properties','distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists')
          w('native/android/app/build.gradle','plugins{id \"com.android.application\"} android{namespace \"com.turrini.drivingsim\" compileSdk 34 defaultConfig{applicationId \"com.turrini.drivingsim\" minSdk 24 targetSdk 34 versionCode 1 versionName \"1.0.0\"} buildTypes{release{minifyEnabled false}} compileOptions{sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17}} dependencies{implementation \"androidx.appcompat:appcompat:1.6.1\" implementation \"com.google.android.material:material:1.11.0\" implementation \"androidx.webkit:webkit:1.9.0\"}')
          w('native/android/app/src/main/res/values/themes.xml','<resources><style name=\"Theme.DrivingSimulator\" parent=\"Theme.AppCompat.Light.NoActionBar\"><item name=\"android:windowFullscreen\">true</item><item name=\"android:windowNoTitle\">true</item></style></resources>')
          w('native/android/app/src/main/AndroidManifest.xml','<?xml version=\"1.0\" encoding=\"utf-8\"?><manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><uses-permission android:name=\"android.permission.INTERNET\"/><application android:allowBackup=\"true\" android:label=\"Driving Simulator\" android:theme=\"@style/Theme.DrivingSimulator\" android:usesCleartextTraffic=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|keyboardHidden|screenSize\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>')
          w('native/android/app/src/main/java/com/turrini/drivingsim/MainActivity.java','package com.turrini.drivingsim; import android.os.Bundle; import android.view.View; import android.webkit.*; import androidx.appcompat.app.AppCompatActivity; public class MainActivity extends AppCompatActivity{private WebView webView; @Override protected void onCreate(Bundle s){super.onCreate(s); webView=new WebView(this); webView.setLayerType(View.LAYER_TYPE_HARDWARE,null); WebSettings st=webView.getSettings(); st.setJavaScriptEnabled(true); st.setDomStorageEnabled(true); st.setDatabaseEnabled(true); st.setAllowFileAccess(true); st.setAllowFileAccessFromFileURLs(true); st.setAllowUniversalAccessFromFileURLs(true); st.setAllowContentAccess(true); st.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); st.setCacheMode(WebSettings.LOAD_DEFAULT); webView.setWebViewClient(new WebViewClient()); webView.setWebChromeClient(new WebChromeClient(){@Override public boolean onConsoleMessage(ConsoleMessage m){android.util.Log.d(\"WebView\",m.message()); return true;}}); webView.loadUrl(\"file:///android_asset/index.html\"); setContentView(webView);} @Override public void onBackPressed(){if(webView.canGoBack()) webView.goBack(); else super.onBackPressed();}}')
          print('ok')
          "
      - name: Copy assets
        run: |
          rm -rf native/android/app/src/main/assets/*; mkdir -p native/android/app/src/main/assets
          cp -r web-build/* native/android/app/src/main/assets/ 2>/dev/null || true
          for d in css js src assets images img models textures libs; do [ -d "$d" ] && cp -r "$d" native/android/app/src/main/assets/ || true; done
          ls -la native/android/app/src/main/assets/
      - name: Build APK
        run: |
          cd native/android
          gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: driving-simulator-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
