name: Driving Simulator CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 18
  BUILD_DIR: dist

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Lint
        run: npx eslint . --ext .js --ignore-pattern "node_modules/" --ignore-pattern "native/" || true
        continue-on-error: true

  build-web:
    name: Build Web Version
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build ALL files
        run: |
          mkdir -p dist
          cp index.html dist/ 2>/dev/null || true
          for dir in css js scripts src assets images img models textures sounds audio libs vendor; do
            if [ -d "$dir" ]; then
              cp -r "$dir" dist/
            fi
          done
          if [ ! -f "dist/libs/babylon.js" ]; then
            mkdir -p dist/libs
            curl -sL https://cdn.babylonjs.com/babylon.js -o dist/libs/babylon.js
            curl -sL https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js -o dist/libs/babylonjs.loaders.min.js
            curl -sL https://cdn.babylonjs.com/gui/babylon.gui.min.js -o dist/libs/babylon.gui.min.js
          fi
          ls -la dist/
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Android
        uses: android-actions/setup-android@v4
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
            - name: Create Android files
        run: |
          mkdir -p native/android/app/src/main/java/com/turrini/drivingsim
          mkdir -p native/android/app/src/main/assets
          mkdir -p native/android/app/src/main/res/values
          mkdir -p native/android/gradle/wrapper

          printf 'buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath "com.android.tools.build:gradle:8.2.0" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > native/android/build.gradle

          printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "DrivingSimulator"\ninclude ":app"\n' > native/android/settings.gradle

          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https://services.gradle.org/distributions/gradle-8.5-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > native/android/gradle/wrapper/gradle-wrapper.properties

          printf 'plugins { id "com.android.application" }\nandroid {\n    namespace "com.turrini.drivingsim"\n    compileSdk 34\n    defaultConfig {\n        applicationId "com.turrini.drivingsim"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0.0"\n    }\n    buildTypes { release { minifyEnabled false } }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n    implementation "androidx.webkit:webkit:1.9.0"\n}\n' > native/android/app/build.gradle

          printf '<resources><style name="Theme.DrivingSimulator" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowFullscreen">true</item><item name="android:windowNoTitle">true</item></style></resources>' > native/android/app/src/main/res/values/themes.xml

          printf '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="Driving Simulator" android:theme="@style/Theme.DrivingSimulator" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > native/android/app/src/main/AndroidManifest.xml
        run: |
          python3 -c "import pathlib; pathlib.Path('native/android/app/src/main/java/com/turrini/drivingsim').mkdir(parents=True, exist_ok=True); pathlib.Path('native/android/app/src/main/assets').mkdir(parents=True, exist_ok=True); pathlib.Path('native/android/app/src/main/res/values').mkdir(parents=True, exist_ok=True); pathlib.Path('native/android/gradle/wrapper').mkdir(parents=True, exist_ok=True)"
          echo 'buildscript { repositories { google(); mavenCentral() } dependencies { classpath "com.android.tools.build:gradle:8.2.0" } } allprojects { repositories { google(); mavenCentral() } }' > native/android/build.gradle
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } } dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS) repositories { google(); mavenCentral() } } rootProject.name = "DrivingSimulator" include ":app"' > native/android/settings.gradle
          echo 'distributionBase=GRADLE_USER_HOME' > native/android/gradle/wrapper/gradle-wrapper.properties
          echo 'distributionPath=wrapper/dists' >> native/android/gradle/wrapper/gradle-wrapper.properties
          echo 'distributionUrl=https://services.gradle.org/distributions/gradle-8.5-bin.zip' >> native/android/gradle/wrapper/gradle-wrapper.properties
          echo 'zipStoreBase=GRADLE_USER_HOME' >> native/android/gradle/wrapper/gradle-wrapper.properties
          echo 'zipStorePath=wrapper/dists' >> native/android/gradle/wrapper/gradle-wrapper.properties
          echo 'plugins { id "com.android.application" } android { namespace "com.turrini.drivingsim" compileSdk 34 defaultConfig { applicationId "com.turrini.drivingsim" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0.0" } buildTypes { release { minifyEnabled false } } compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation "androidx.appcompat:appcompat:1.6.1" implementation "com.google.android.material:material:1.11.0" implementation "androidx.webkit:webkit:1.9.0" }' > native/android/app/build.gradle
          echo '<resources><style name="Theme.DrivingSimulator" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowFullscreen">true</item><item name="android:windowNoTitle">true</item></style></resources>' > native/android/app/src/main/res/values/themes.xml
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="Driving Simulator" android:theme="@style/Theme.DrivingSimulator" android:usesCleartextTraffic="true"><activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|keyboardHidden|screenSize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > native/android/app/src/main/AndroidManifest.xml
      - name: Create MainActivity
        run: |
          cat > native/android/app/src/main/java/com/turrini/drivingsim/MainActivity.java << 'ENDJAVA'
          package com.turrini.drivingsim;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.ConsoleMessage;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  webView.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setAllowContentAccess(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onConsoleMessage(ConsoleMessage m) {
                          android.util.Log.d("WebView", m.message());
                          return true;
                      }
                  });
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          ENDJAVA
      - name: Copy assets
        run: |
          rm -rf native/android/app/src/main/assets/*
          mkdir -p native/android/app/src/main/assets
          cp -r web-build/* native/android/app/src/main/assets/ 2>/dev/null || true
          for d in css js src assets images img models textures libs; do if [ -d "$d" ]; then cp -r "$d" native/android/app/src/main/assets/ || true; fi; done
          ls -la native/android/app/src/main/assets/
      - name: Build APK
        run: |
          cd native/android
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: driving-simulator-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
