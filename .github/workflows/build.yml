name: Native Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: جمع كاع الملفات وحطهم فـ assets
        run: |
          echo "=== الملفات اللي عندك ==="
          ls -la
          echo "=== كنقلب على مجلد المشروع ==="
          # فين كاين الـ app folder
          APP_DIR=$(find . -type d -name "app" | head -n 1)
          echo "App dir: $APP_DIR"
          mkdir -p $APP_DIR/src/main/assets
          
          # جيب كاع الملفات الإضافية وحطهم فـ assets باش يبانو فاللعبة
          for d in assets images data sounds levels raw; do
            if [ -d "$d" ] && [ "$d" != "$APP_DIR/src/main/assets" ]; then
              echo "Copy $d -> $APP_DIR/src/main/assets/"
              cp -r $d/* $APP_DIR/src/main/assets/ 2>/dev/null || cp -r $d $APP_DIR/src/main/assets/ 2>/dev/null || true
            fi
          done
          
          # جيب الملفات الكبار اللي برا
          cp -r *.json *.png *.jpg *.mp3 *.db $APP_DIR/src/main/assets/ 2>/dev/null || true
          
          echo "=== اللي غادي يدخل فالـ APK ==="
          ls -R $APP_DIR/src/main/assets | head -n 100

      - name: بناء APK أصلي
        run: |
          # لقا gradlew فين ما كان
          GRADLEW=$(find . -name "gradlew" | head -n 1)
          echo "Gradlew found: $GRADLEW"
          chmod +x $GRADLEW
          # نظف وبني
          $(dirname $GRADLEW)/gradlew clean || ./gradlew clean || true
          $(dirname $GRADLEW)/gradlew assembleDebug --stacktrace

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: native-game-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
