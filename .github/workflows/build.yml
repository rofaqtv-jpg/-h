name: Native Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: 21 }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }

      - name: جمع كاع الملفات
        run: |
          ls -la || true
          mkdir -p app/src/main/assets || true
          echo "Copying extra files to assets..."
          cp -r assets app/src/main/assets/ 2>/dev/null || true
          cp -r images app/src/main/assets/ 2>/dev/null || true
          cp -r data app/src/main/assets/ 2>/dev/null || true
          cp -r sounds app/src/main/assets/ 2>/dev/null || true
          cp -r levels app/src/main/assets/ 2>/dev/null || true
          cp *.json app/src/main/assets/ 2>/dev/null || true
          cp *.png app/src/main/assets/ 2>/dev/null || true
          cp *.mp3 app/src/main/assets/ 2>/dev/null || true
          ls -R app/src/main/assets 2>/dev/null | head -n 50 || true

      - name: بناء APK
        run: |
          echo "Checking for gradlew..."
          ls -la || true
          if [ -f "./gradlew" ]; then
            echo "Found ./gradlew"
            chmod +x ./gradlew || true
            ./gradlew clean assembleDebug || gradle clean assembleDebug
          else
            echo "No gradlew found, using system gradle"
            gradle clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-native-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
