name: Build APK - All Files
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: 21 }
      - uses: android-actions/setup-android@v4

      - name: نسخ كاع الملفات لـ www
        run: |
          mkdir -p www
          # كنجبد كلشي من الروت ونحطو فـ www باش يبان فاللعبة
          cp -r assets www/ 2>/dev/null || true
          cp -r images www/ 2>/dev/null || true
          cp -r img www/ 2>/dev/null || true
          cp -r data www/ 2>/dev/null || true
          cp -r sounds www/ 2>/dev/null || true
          cp -r audio www/ 2>/dev/null || true
          cp -r levels www/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp *.png *.jpg www/ 2>/dev/null || true
          ls -R www | head -n 100

      - run: npm install || true
      - run: npm run build || true

      - run: |
          npx cap add android || true
          npx cap copy android
          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: my-game-full
          path: android/app/build/outputs/apk/debug/app-debug.apk
