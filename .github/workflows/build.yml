name: Build APK - Final Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: 21 }
      - uses: android-actions/setup-android@v4

      - name: Prepare www with all files
        run: |
          rm -f package-lock.json || true
          mkdir -p www
          cp -r assets images img data sounds audio levels www/ 2>/dev/null || true
          cp -r *.html *.js *.json *.css *.png *.jpg *.mp3 www/ 2>/dev/null || true
          if [ ! -f "www/index.html" ]; then
            [ -f "index.html" ] && cp index.html www/ || echo "<html><body><h1>My Game</h1></body></html>" > www/index.html
          fi
          ls www | head -n 20

      - name: Init and Build
        run: |
          npm init -y || true
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save --legacy-peer-deps
          echo '{"appId":"com.game.app","appName":"MyGame","webDir":"www"}' > capacitor.config.json
          rm -rf android || true
          npx cap add android
          npx cap copy android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          cd android && chmod +x gradlew && ./gradlew clean && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
